[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-rag"
version = "0.1.0"
description = "Grounded expense-policy assistant (Mini RAG Lab)"
requires-python = ">=3.11"
dependencies = [
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: tests that need network, models, or Postgres",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["mini_rag"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "psycopg", "pgvector", "pgvector.psycopg"]
ignore_missing_imports = true
