[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-rag"
version = "0.1.0"
description = "Grounded expense-policy assistant (Mini RAG Lab)"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not integration"]
markers = [
    "integration: tests that need network, models, or Postgres",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["mini_rag"]

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "sentence_transformers",
    "transformers",
    "pdfplumber",
    "docx",
    "psycopg",
    "pgvector",
    "pgvector.psycopg",
]
ignore_missing_imports = true
follow_imports = "skip"
